<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Debug CMS - CrossCheck</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    .success { background: #d4edda; border-color: #c3e6cb; }
    .error { background: #f8d7da; border-color: #f5c6cb; }
    .info { background: #d1ecf1; border-color: #bee5eb; }
  </style>
</head>
<body>
  <h1>🔍 Debug CMS CrossCheck</h1>
  <div id="tests"></div>
  
  <script>
    const tests = document.getElementById('tests');
    
    function addTest(name, result, details = '') {
      const div = document.createElement('div');
      div.className = `test ${result}`;
      div.innerHTML = `<strong>${name}:</strong> ${result === 'success' ? '✅' : result === 'error' ? '❌' : 'ℹ️'} ${details}`;
      tests.appendChild(div);
    }
    
    // Test 1: URL
    addTest('Test 1: URL', 'info', `Protocole: ${window.location.protocol}, Chemin: ${window.location.pathname}`);
    
    // Test 2: Charger le script
    const script = document.createElement('script');
    script.src = '../js/articles-data.js';
    
    script.onload = function() {
      addTest('Test 2: Chargement script', 'success', 'Le script articles-data.js a été chargé');
      
      // Test 3: Vérifier ARTICLES_DATA après un court délai
      setTimeout(function() {
        if (typeof ARTICLES_DATA !== 'undefined') {
          const total = Object.keys(ARTICLES_DATA).reduce((sum, key) => sum + (ARTICLES_DATA[key]?.length || 0), 0);
          addTest('Test 3: Variable ARTICLES_DATA', 'success', `Définie avec ${total} articles`);
          
          // Test 4: Structure
          const genres = Object.keys(ARTICLES_DATA);
          addTest('Test 4: Structure', 'success', `Genres: ${genres.join(', ')}`);
        } else {
          addTest('Test 3: Variable ARTICLES_DATA', 'error', 'Non définie après chargement du script');
        }
      }, 100);
    };
    
    script.onerror = function() {
      addTest('Test 2: Chargement script', 'error', 'Impossible de charger articles-data.js - Vérifiez le chemin');
    };
    
    document.head.appendChild(script);
    
    // Test 5: Vérifier après 2 secondes
    setTimeout(function() {
      if (typeof ARTICLES_DATA === 'undefined') {
        addTest('Test 5: Vérification finale', 'error', 'ARTICLES_DATA toujours non défini après 2 secondes');
      } else {
        addTest('Test 5: Vérification finale', 'success', 'ARTICLES_DATA est disponible');
      }
    }, 2000);
  </script>
</body>
</html>
