<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Simple - CrossCheck CMS</title>
</head>
<body>
  <h1>Test de chargement de articles-data.js</h1>
  <div id="result"></div>
  
  <script src="../js/articles-data.js"></script>
  <script>
    const result = document.getElementById('result');
    
    setTimeout(function() {
      if (typeof ARTICLES_DATA !== 'undefined') {
        const total = Object.keys(ARTICLES_DATA).reduce((sum, key) => sum + (ARTICLES_DATA[key]?.length || 0), 0);
        result.innerHTML = `
          <h2 style="color: green;">✅ SUCCÈS</h2>
          <p>ARTICLES_DATA est chargé!</p>
          <p>Nombre total d'articles: <strong>${total}</strong></p>
          <pre>${JSON.stringify(ARTICLES_DATA, null, 2).substring(0, 500)}...</pre>
        `;
      } else {
        result.innerHTML = `
          <h2 style="color: red;">❌ ÉCHEC</h2>
          <p>ARTICLES_DATA n'est pas défini.</p>
          <p>Vérifiez:</p>
          <ul>
            <li>Le fichier <code>../js/articles-data.js</code> existe-t-il?</li>
            <li>Le chemin est-il correct depuis <code>admin/test-simple.html</code>?</li>
            <li>Ouvrez la console (F12) pour voir les erreurs</li>
          </ul>
        `;
      }
    }, 500);
  </script>
</body>
</html>
